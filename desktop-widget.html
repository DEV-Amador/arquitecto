<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c2410c">
<title>Acero para columnas</title>
<style>
:root{color-scheme:light;--bg:#f5f5f4;--panel:#fff;--tx:#1c1917;--mu:#78716c;--ac:#c2410c;--bd:#e7e5e4;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:14px "Segoe UI",system-ui,sans-serif}
.window{width:min(420px,100%);margin:0 auto;background:var(--panel);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 28px #1c191722;overflow:hidden}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--ac);color:#fff;font-weight:700}
.brand h1{margin:0;font-size:14px;font-weight:650}
.brand p{margin:2px 0 0;color:var(--mu);font-size:11px}
a{color:var(--ac);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
a:hover{text-decoration:underline}
main{padding:14px}
h2{margin:0 0 10px;font-size:13px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
label{display:block;color:var(--mu);font-size:11px}
input,select{display:block;width:100%;height:36px;margin-top:4px;padding:0 9px;border:1px solid var(--bd);border-radius:5px;background:#fff;color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid #c2410c55;border-color:var(--ac)}
details{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
summary{cursor:pointer;font-size:12px;font-weight:600}
.options{padding-top:10px}
.results{margin-top:14px;border-top:1px solid var(--bd)}
.results-heading{display:flex;justify-content:space-between;gap:12px;padding:12px 0 8px}
.results-heading h2{margin:0}
.context{color:var(--mu);font-size:11px;text-align:right}
.result-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.material{font-size:12px;font-weight:650}
.needed{margin-top:3px;color:var(--mu);font-size:11px;line-height:1.35}
.buy{text-align:right;white-space:nowrap}
.quantity{font-size:21px;line-height:1.1;color:var(--ac);font-weight:700}
.buy-label{display:block;margin-top:2px;color:var(--mu);font-size:10px}
.message{margin:10px 0 0;color:var(--bad);font-size:11px}
.footnote{margin:12px 0 0;color:var(--mu);font-size:10px}
[hidden]{display:none!important}
@media(max-width:360px){body{padding:8px}main{padding:11px}.titlebar{padding:10px 11px}}
</style>
</head>
<body>
<div class="window">
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">V</span>
      <div><h1>Acero para columnas</h1><p>Cálculo rápido de compra</p></div>
    </div>
    <a href="./index.html" target="_blank" rel="noopener">Abrir calculadora ↗</a>
  </header>
  <main>
    <section aria-labelledby="dimensions-title">
      <h2 id="dimensions-title">Dimensiones</h2>
      <div class="fields">
        <label for="b">Ancho (cm)<input id="b" type="number" value="30" min="1" inputmode="decimal"></label>
        <label for="h">Largo (cm)<input id="h" type="number" value="30" min="1" inputmode="decimal"></label>
        <label for="alt">Altura (m)<input id="alt" type="number" value="4" min="0.1" step="0.1" inputmode="decimal"></label>
        <label for="nc">Columnas<input id="nc" type="number" value="1" min="1" step="1" inputmode="numeric"></label>
      </div>
    </section>
    <details>
      <summary>Acero y compra</summary>
      <div class="fields options">
        <label for="dv">Varilla longitudinal<select id="dv"></select></label>
        <label for="de">Varilla de estribo<select id="de"></select></label>
        <label for="sep">Separación de estribos (cm)<input id="sep" type="number" value="20" min="1" inputmode="decimal"></label>
        <label for="rec">Recubrimiento (cm)<input id="rec" type="number" value="4" min="0" step="0.5" inputmode="decimal"></label>
        <label for="lc">Longitud comercial (m)<input id="lc" type="number" value="12" min="0.1" inputmode="decimal"></label>
        <label for="des">Desperdicio (%)<input id="des" type="number" value="10" min="0" inputmode="decimal"></label>
      </div>
    </details>
    <p id="validation-message" class="message" role="alert" hidden></p>
    <section class="results" aria-labelledby="results-title">
      <div class="results-heading">
        <h2 id="results-title">Material y compra</h2>
        <span id="purchase-context" class="context"></span>
      </div>
      <div id="materials-output" aria-live="polite"></div>
    </section>
    <p id="storage-message" class="message" role="status" hidden></p>
    <p class="footnote">Los valores se guardan en este navegador.</p>
  </main>
</div>
<script type="module">
import { InputsController } from './controllers/inputs-controller.js';
import { DesignController } from './controllers/design-controller.js';
import { MaterialsController } from './controllers/materials-controller.js';
import { StorageController } from './controllers/storage-controller.js';
import { ValidationController } from './controllers/validation-controller.js';

const inputs = new InputsController();
const storage = new StorageController();
storage.initialize(inputs.fields);
const design = new DesignController();
const materials = new MaterialsController();
const validation = new ValidationController();
const output = document.getElementById('materials-output');
const context = document.getElementById('purchase-context');
const format = value => Number(value).toFixed(2);

function update() {
  if (!validation.validate()) {
    output.textContent = '';
    context.textContent = '';
    return;
  }
  const values = inputs.getValues();
  if (!values) return;
  const material = materials.calculate(values, design.calculate(values));
  const columnLabel = material.columnCount === 1 ? 'columna' : 'columnas';
  context.textContent = `${material.columnCount} ${columnLabel} · ${format(material.height)} m`;
  output.innerHTML =
    `<div class="result-row"><div><div class="material">Varilla longitudinal ${material.longitudinalBar}</div><div class="needed">${format(material.longitudinalWithWaste)} m necesarios, con desperdicio</div></div><div class="buy"><span class="quantity">${material.longitudinalPieces}</span><span class="buy-label">piezas de ${material.commercialLength} m</span></div></div>`
    + `<div class="result-row"><div><div class="material">Estribos ${material.stirrupBar}</div><div class="needed">${format(material.stirrupWithWaste)} m necesarios, con desperdicio</div></div><div class="buy"><span class="quantity">${material.stirrupPieces}</span><span class="buy-label">piezas de ${material.commercialLength} m</span></div></div>`;
}

inputs.onChange(update);
update();
</script>
</body>
</html>
